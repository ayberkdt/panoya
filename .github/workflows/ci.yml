# Not yet executed: the repository has no remote. Runs lint, typecheck, unit tests and build on
# every push/PR; E2E uses bundled Chromium (PW_CHANNEL=chromium) because CI has no Edge.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
  e2e:
    runs-on: ubuntu-latest
    needs: check
    env:
      PW_CHANNEL: chromium
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
